###############################################
# SPOT ARM - MoveIt Servo
# ROS 2 Humble
###############################################

# Real robot, not Gazebo
use_gazebo: false


###############################################
# INPUT COMMANDS
###############################################

# Joystick values are in the range [-1.0, 1.0]
command_in_type: "unitless"

# Full-stick Cartesian velocity scaling
scale:
  linear: 0.08
  rotational: 0.30
  joint: 0.30

# The "~" resolves under /servo_node
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds

# Commands from the gamepad are expressed relative to base_link
robot_link_command_frame: base_link

# Stop if commands stop arriving
incoming_command_timeout: 0.15


###############################################
# OUTPUT TO ros2_control
###############################################

command_out_topic: /arm_controller/joint_trajectory

command_out_type: "trajectory_msgs/JointTrajectory"

# Your ros2_control interface is position based
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

# Start slowly because the motor network is Modbus.
# 0.20 sec = 5 Hz
publish_period: 0.20

joint_topic: /joint_states


###############################################
# MOVEIT ROBOT INFORMATION
###############################################

move_group_name: arm

planning_frame: base_link

ee_frame_name: fake_gripper

is_primary_planning_scene_monitor: false

monitored_planning_scene_topic: /monitored_planning_scene


###############################################
# HALTING / SAFETY
###############################################

num_outgoing_halt_msgs_to_publish: 5

halt_all_joints_in_joint_mode: true

halt_all_joints_in_cartesian_mode: true


###############################################
# COLLISION CHECKING
###############################################

check_collisions: true

collision_check_rate: 5.0

self_collision_proximity_threshold: 0.01

scene_collision_proximity_threshold: 0.02


###############################################
# SINGULARITY PROTECTION
###############################################

lower_singularity_threshold: 17.0

hard_stop_singularity_threshold: 30.0

leaving_singularity_threshold_multiplier: 2.0


###############################################
# VELOCITY SCALING
###############################################

override_velocity_scaling_factor: 0.0


###############################################
# FILTERING
###############################################

smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"


###############################################
# STATUS
###############################################

status_topic: ~/status
